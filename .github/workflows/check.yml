name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node --check agent/agent.mjs && bash -n agent/install.sh && bash -n runner/entrypoint.sh
      # The legacy builder, as on Ubuntu's docker.io package that agent/install.sh installs.
      - run: DOCKER_BUILDKIT=0 docker build -t jitrunner-runner runner/
      - name: The job image runs the GitHub runner
        run: docker run --rm --entrypoint ./run.sh jitrunner-runner --version
      # As an agent runs it: the runner user must be able to write its workspace and the cached folders, volumes or not.
      - name: The runner can write its workspace and caches
        run: |
          docker run --rm --entrypoint sh \
            -v check-tool:/opt/actions-runner/_work/_tool -v check-cache:/home/runner/.cache \
            -v check-pnpm:/home/runner/.local/share/pnpm jitrunner-runner -c \
            'mkdir -p _work/repo _work/_tool/node ~/.cache/ms-playwright ~/.local/share/pnpm/store ~/.local/bin'
